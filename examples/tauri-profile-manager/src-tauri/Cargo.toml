[package]
name = "tauri-profile-manager"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Its own workspace (own lock, tauri and turso), never part of the plugin's
# build or of any checkout it sits inside.
[workspace]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_profile_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Serves the app's window over WebDriver (127.0.0.1, behind a token): it
# registers `tauri_plugin_sbrs_automation::init()`, for the end-to-end test in
# `tests/e2e_automation.rs`. Never enable it in a build you ship.
e2e = []

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.4", features = [] }

[dependencies]
tauri = { version = "=3.0.0-alpha.5", features = [] }
# Tauri 3 no longer picks a runtime itself: the app names one (see `run`). CEF
# (Chromium) runs on macOS, Windows and Linux, and its in-process DevTools
# channel lets a profile's window take the whole `StealthPlan`.
tauri-runtime-cef = "=3.0.0-alpha.6"
tauri-plugin-opener = "=3.0.0-alpha.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `turso` provides `storage::ProfileVault`, the encrypted profile store. The
# same tag as the plugin's, so the app and the plugin share one copy of the
# library and its types.
seleniumbase-rs = { git = "https://github.com/MustCodeAl/seleniumbase-rs", tag = "v0.7.0", features = ["turso"] }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "net"] }
uuid = { version = "1", features = ["v4"] }
actix-web = "4"
actix-cors = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The vault passphrase lives in the operating system's keychain. Keyring 4's
# `v1` feature is the simple API; it pulls in only the store for the target
# platform (Keychain on macOS, Credential Manager on Windows, Secret Service on
# other Unix systems).
keyring = { version = "4.2", default-features = false, features = ["v1"] }
# OS randomness for the generated vault passphrase.
getrandom = "0.4"
# SHA-256 of the legacy files, to recognise one that was already imported.
ring = "0.17"
# The plugin of this repository (an app of your own takes it by `git`). Its
# `stealth` feature gives a profile's app window the profile's fingerprint
# (`src/app_window.rs`) and is fit for a shipped build: no port, no listener.
# Its WebDriver endpoint is registered only with the `e2e` feature.
tauri-plugin-sbrs-automation = { path = "../../..", features = ["stealth"] }

[dev-dependencies]
# `test-util` adds `sb_cdp::Browser::new_mocked`, so Pure CDP sessions can be
# tested without launching Chrome.
seleniumbase-rs = { git = "https://github.com/MustCodeAl/seleniumbase-rs", tag = "v0.7.0", features = ["turso", "test-util"] }
tempfile = "3"
tokio = { version = "1", features = ["macros"] }

# Starts the app and drives its window; needs the plugin, so only with `e2e`.
[[test]]
name = "e2e_automation"
required-features = ["e2e"]

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
