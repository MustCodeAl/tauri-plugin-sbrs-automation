[package]
name = "tauri-plugin-sbrs-automation"
version = "0.1.0"
description = "Drive a Tauri app's webview from seleniumbase-rs (sbrs) tests: a W3C WebDriver endpoint inside the app, on macOS, Windows and Linux"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/MustCodeAl/tauri-plugin-sbrs-automation"
links = "tauri-plugin-sbrs-automation"
keywords = ["tauri", "webdriver", "testing", "automation", "seleniumbase"]

[features]
default = []
# Optional Chromium launch settings for an app-owned CEF or WebView2. No
# dependencies: the few flags it needs are kept in `src/cdp.rs`.
cdp = []

[[test]]
name = "cdp_env"
path = "tests/cdp_env.rs"
harness = false
required-features = ["cdp"]

[dependencies]
tauri = { version = "=3.0.0-alpha.4", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[build-dependencies]
tauri-plugin = { version = "=3.0.0-alpha.3", features = ["build"] }

# Screenshots on macOS: WKWebView's own snapshot, encoded as PNG. Tauri
# already builds these crates on macOS; only more of their features are used.
[target.'cfg(target_os = "macos")'.dependencies]
base64 = "0.22"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKSnapshotConfiguration"] }

[dev-dependencies]
sha2 = "0.10"
